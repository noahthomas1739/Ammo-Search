# Ammo deal monitor configuration.
# Thresholds are delivered cost per round in DOLLARS (0.25 = 25¢), including shipping and tax.

location:
  state: TX
  sales_tax_rate: 0.0825      # TX 6.25% state + up to 2% local. Set to your exact local rate.
  tax_shipping: true          # Texas taxes shipping charges on taxable items

purchase:
  # When small boxes must be bundled (to reach 500 rds of 9mm, a 250-shell
  # case, or free shipping), never assume an order bigger than this.
  max_order_total: 700

# How pages are loaded. HTML pages render in a standard headless Chromium;
# feeds/sitemaps use plain HTTP. robots.txt is obeyed, and a site that refuses
# (403 / bot check) is skipped for the rest of the run, never worked around.
fetch:
  browser: true
  respect_robots_txt: true
  cache_hours: 5            # reuse a page loaded within this many hours instead of re-loading it
  max_retries: 2            # temporary errors (timeout, 429, 5xx) are retried with backoff...
  retry_backoff_seconds: 15 # ...15 s, then 45 s, or the site's Retry-After if it gives one
  max_retry_wait_seconds: 120   # a longer Retry-After means: stop for this run, try next run
  round_count_lookups: 15       # listings with no round count: product pages read per site per run
  max_run_minutes: 25           # stores not reached in this time are checked next run
  restricted_recheck_days: 7    # a 403 / CAPTCHA / robots.txt "no" is remembered this long, then re-checked
  min_delay_seconds: 8      # random pause between page loads on the same site
  max_delay_seconds: 20

allow_unlisted_retailers: true   # aggregators surface other stores; those alerts get a "check retailer" note
marketplace_sellers: [GunBroker, Armslist, GunsAmerica, eBay, Gun Genie, GunAuction, Guns International]

alerts:
  realert_price_drop: 0.005   # re-text a deal already sent if it drops another 0.5¢/rd or more
  realert_after_days: 7       # ...or if it is still live this many days later
  digest_repeat_days: 3       # a GOOD deal reappears in the daily digest at most every N days
  health_warning_after_runs: 4     # email a warning after this many runs in a row find no usable products
  health_warning_every_days: 3

categories:
  9mm:
    enabled: true
    grains: [115, 124]
    min_rounds: 500
    good: 0.25
    great: 0.23
    exceptional: 0.21
    suspicious_below: 0.15

  # Browning A5: set to true once a load is confirmed to cycle. Until then every
  # 12 ga alert says to buy one case only.
  a5_cycling_confirmed: false

  12ga_a:   # Priority A: 2-3/4" lead 1-1/4 oz, high velocity
    enabled: true
    shot_oz: 1.25
    shot_sizes: ["6", "7.5", "8", "9"]
    min_velocity: 1275          # "about 1300 fps or more"; 1275 accepted (2026-11-16)
    allow_unknown_velocity: true  # alert with a "verify velocity" note when fps isn't listed
    min_rounds: 250
    good: 0.58
    great: 0.50
    exceptional: 0.45
    suspicious_below: 0.30

  12ga_b:   # Priority B (test loads): 2-3/4" lead 1-1/8 oz at 1250+ fps
    enabled: true
    shot_oz: 1.125
    min_velocity: 1250
    min_rounds: 250
    good: 0.42
    great: 0.36
    suspicious_below: 0.22

  762x54r:
    enabled: true
    min_rounds: 0
    good: 0.55
    great: 0.45
    exceptional: 0.40
    can_440_good_total: 240
    can_440_great_total: 200
    suspicious_below: 0.30

# Used for any store without its own rule (e.g. found via an aggregator).
default_shipping: {flat: 14.99, verified: false}

# Shipping rules: flat = fee per order, free_over = order subtotal that ships free,
# free_min_rounds = a single listing of at least this many rounds ships free.
# Few of these could be confirmed online. "verified: false" makes alerts say
# shipping is an estimate. Check each store's checkout once, fix the numbers,
# and set verified: true.
#
# pages = listing/search pages to scrape for each caliber. Store URLs change.
# Run `python -m ammo_finder doctor` (or the "doctor" workflow) to see which
# pages return products, and fix the ones that don't.
retailers:
  - name: LuckyGunner
    # 2026-11-15: listing pages refused automated requests (HTTP 403) from home. That answer is
    # cached and re-checked weekly; the sitemap is tried first.
    aliases: [Lucky Gunner]
    domain: luckygunner.com
    sitemaps: {urls: [robots], max_products: 10}   # product URLs from the sitemap listed in robots.txt
    shipping: {flat: 14.99, verified: false}
    pages:
      9mm: [https://www.luckygunner.com/handgun/9mm-ammo]
      12ga: [https://www.luckygunner.com/shotgun/12-gauge-ammo]
      762x54r: [https://www.luckygunner.com/rifle/7.62x54r-ammo]

  - name: Ammo.com
