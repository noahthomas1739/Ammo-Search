# Aggregators list many stores. The retailer name is read from each row and
# matched against the list above. Unknown stores get default_shipping.
aggregators:
  - name: AmmoSeek
    enabled: false   # refuses automated requests (403); no public API or feed
    base_url: https://ammoseek.com
    # No public API or feed. Its own price alerts (free account) email/text you: ammoseek.com
    pages:
      9mm: [https://ammoseek.com/ammo/9mm-luger]
      12ga: [https://ammoseek.com/ammo/12-gauge]
      762x54r: [https://ammoseek.com/ammo/7.62x54r]
  - name: gun.deals
    base_url: https://gun.deals
    # Search pages refuse automated requests (403), so they're commented out.
    # The site-wide RSS feed (unconfirmed) is meant for feed readers. Items that
    # match your calibers are read from it. Run `discover` to confirm it exists.
    feeds: [https://gun.deals/rss.xml]
