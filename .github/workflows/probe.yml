name: Probe store pages (diagnostics)
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only sources whose name contains (blank = all)"
        required: false
        default: ""
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - run: python -m ammo_finder probe ${{ inputs.only && format('--only "{0}"', inputs.only) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-pages
          path: debug/
          retention-days: 7
